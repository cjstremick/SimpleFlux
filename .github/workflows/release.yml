name: Publish Release

# Manual: promote a prerelease to a stable release (or release directly).
# Trigger: Actions tab -> "Publish Release" -> Run workflow -> version input.
#
# How promotion works:
#   - Input a prerelease version (e.g. 1.1.0-alpha.1) -> it verifies that prerelease
#     exists on NuGet, strips the suffix, and publishes 1.1.0 as the stable release.
#   - Input a stable version (e.g. 1.1.0) -> publishes that version directly, no
#     prerelease required.
#
# Creates: NuGet package + GitHub Release + git tag (vX.Y.Z).

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release: a prerelease to promote (e.g. 1.1.0-alpha.1) or a stable version (e.g. 1.1.0)'
        required: true
        type: string

permissions:
  contents: write

# One publish at a time — prevents accidental parallel NuGet pushes.
concurrency:
  group: publish-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Validate version and compute release version
        id: version
        shell: bash
        run: |
          INPUT="${{ inputs.version }}"
          if [[ ! "$INPUT" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z][0-9A-Za-z.-]*)?$ ]]; then
            echo "::error::Invalid version '$INPUT'. Expected semver like 1.1.0 or 1.1.0-alpha.1"
            exit 1
          fi
          if [[ "$INPUT" == *-* ]]; then
            STABLE="${INPUT%%-*}"
            echo "promoting=true" >> "$GITHUB_OUTPUT"
            echo "Input '$INPUT' is a prerelease -> promoting to stable '$STABLE'."
          else
            STABLE="$INPUT"
            echo "promoting=false" >> "$GITHUB_OUTPUT"
            echo "Input '$INPUT' is already stable."
          fi
          echo "version=$STABLE" >> "$GITHUB_OUTPUT"
          echo "prerelease_input=$INPUT" >> "$GITHUB_OUTPUT"

      - name: Verify NuGet API key is configured
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          if [ -z "$NUGET_API_KEY" ]; then
            echo "::error::The NUGET_API_KEY secret is not set. Create an API key at https://www.nuget.org/account/apikeys and add it under Settings > Secrets and variables > Actions (see RELEASING.md)."
            exit 1
          fi

      - name: Check stable version not already published
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://api.nuget.org/v3-flatcontainer/simpleflux/$VERSION/simpleflux.$VERSION.nupkg")
          if [ "$CODE" = "200" ]; then
            echo "::error::SimpleFlux $VERSION already exists on NuGet (HTTP $CODE). Pick a new version."
            exit 1
          fi
          echo "Stable version $VERSION is not on NuGet yet (HTTP $CODE) - good to go."

      - name: Verify the prerelease exists on NuGet
        if: steps.version.outputs.promoting == 'true'
        run: |
          PRERELEASE="${{ steps.version.outputs.prerelease_input }}"
          CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://api.nuget.org/v3-flatcontainer/simpleflux/$PRERELEASE/simpleflux.$PRERELEASE.nupkg")
          if [ "$CODE" != "200" ]; then
            echo "::error::SimpleFlux $PRERELEASE was not found on NuGet (HTTP $CODE). Publish the prerelease first, then promote it."
            exit 1
          fi
          echo "Found SimpleFlux $PRERELEASE on NuGet. Promoting it to ${{ steps.version.outputs.version }}."

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release -p:Version=${{ steps.version.outputs.version }}

      - name: Pack
        run: dotnet pack --no-restore --no-build --configuration Release -p:Version=${{ steps.version.outputs.version }} -p:IncludeSymbols=true -p:SymbolPackageFormat=snupkg --output artifacts

      - name: Push to NuGet
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          # Every SimpleFlux* package (core + backends) publishes at this version.
          dotnet nuget push "artifacts/SimpleFlux*.nupkg" \
            --api-key "$NUGET_API_KEY" \
            --source https://api.nuget.org/v3/index.json \
            --symbol-source https://api.nuget.org/v3/index.json

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          gh release create "v$VERSION" \
            artifacts/SimpleFlux*.nupkg \
            --title "SimpleFlux $VERSION" \
            --notes "Stable release of SimpleFlux $VERSION. Install with: dotnet add package SimpleFlux --version $VERSION"
